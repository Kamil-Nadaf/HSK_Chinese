plugins { id 'com.android.application' }
android {
  namespace 'com.maruf.hsksprint'
  compileSdk 34
  defaultConfig { applicationId 'com.maruf.hsksprint'; minSdk 24; targetSdk 34; versionCode 2; versionName '1.1' }
  signingConfigs { debug { storeFile file('../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
  buildTypes { release { minifyEnabled false } }
  androidResources { noCompress 'mp3' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
