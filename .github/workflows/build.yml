name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths: ["HSK_Sprint/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["HSK_Sprint/**", ".github/workflows/build.yml"]

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Copy the web app into the APK
        run: |
          mkdir -p HSK_Sprint/android/app/src/main/assets/site
          cp -r HSK_Sprint/site/. HSK_Sprint/android/app/src/main/assets/site/
      - name: Build
        working-directory: HSK_Sprint/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HSK-Sprint-android
          path: HSK_Sprint/android/app/build/outputs/apk/debug/app-debug.apk

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, script: "dist:mac" }
          - { name: Windows, os: windows-latest, script: "dist:win" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: HSK_Sprint/desktop
        run: npm install --no-audit --no-fund
      - name: Build installer
        working-directory: HSK_Sprint/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: HSK-Sprint-${{ matrix.name }}
          path: |
            HSK_Sprint/desktop/dist/*.dmg
            HSK_Sprint/desktop/dist/*.exe

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hsk-sprint
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: HSK_Sprint
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Collect files
        run: |
          mkdir release
          cp out/HSK-Sprint-android/app-debug.apk release/HSK-Sprint-${{ github.ref_name }}-android.apk
          find out -name '*.dmg' -o -name '*.exe' | xargs -I{} cp {} release/
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
